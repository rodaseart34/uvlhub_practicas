name: 02_runner

on:
  push:
    branches: [develop]

jobs:
  informacion:
    runs-on: ubuntu-24.04
    steps:
    - name: mostar OS
      run: lsb_release -a
    - name: mostrar directorio
      run: pwd
    - name: version de Python
      run: python3 --version
    - name: contenido del directorio actual
      run: ls 